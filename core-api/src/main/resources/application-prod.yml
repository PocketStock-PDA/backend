# core-api 운영(데모) 오버라이드 — SPRING_PROFILES_ACTIVE=prod 일 때 application.yml 위에 덮어씀
logging:
  level:
    com.pocketstock: INFO
    org.mybatis: INFO
server:
  shutdown: graceful
auth:
  refresh-cookie:
    secure: false   # HTTP 데모용(쿠키 전송 허용). 도메인+HTTPS 붙이면 true로 되돌리기
management:
  health:
    kafka:
      enabled: false
webpush:
  test-endpoint:
    enabled: true   # 개발용 푸시 검수 엔드포인트(POST /api/notifications/test) — 검수 후 제거
